[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faq-eval"
version = "0.1.0"
description = "Hallucination eval for a college FAQ bot: accuracy on answerable questions, refusal rate on unanswerable ones."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "regex>=2024.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
faq-eval = "faq_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
